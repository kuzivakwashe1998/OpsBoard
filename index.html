<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpsBoard — a business operations dashboard with KPIs, charts and reporting for managers who need answers in seconds, not spreadsheets." />
    <meta name="color-scheme" content="light dark" />
    <title>OpsBoard — Business Operations Dashboard</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Crect x='7' y='16' width='4' height='9' rx='1.5' fill='white'/%3E%3Crect x='14' y='9' width='4' height='16' rx='1.5' fill='white' opacity='.88'/%3E%3Crect x='21' y='12' width='4' height='13' rx='1.5' fill='white' opacity='.72'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var t = localStorage.getItem('opsboard-ui')
        if (t && JSON.parse(t) && JSON.parse(t).state && JSON.parse(t).state.theme === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        /* noop */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
